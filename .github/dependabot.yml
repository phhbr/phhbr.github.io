# Weekly, grouped updates. The cooldown matches pnpm's minimumReleaseAge
# (pnpm-workspace.yaml), so Dependabot never proposes a version pnpm would refuse.
version: 2
updates:
  - package-ecosystem: npm # also covers pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    ignore:
      # `astro check` needs TypeScript's programmatic API, which TypeScript 7 (the
      # native compiler) doesn't ship yet: https://github.com/withastro/roadmap/discussions/1321
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      dependencies:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      actions:
        patterns: ['*']
