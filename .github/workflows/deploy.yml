# Build, test and rsync the site to the VPS.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, tag or branch to deploy (use an older commit to roll back)
        required: true
        default: main

permissions: {}

# Queue deploys instead of cancelling one mid-rsync.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.ref }}
    permissions:
      contents: read

  deploy:
    name: Deploy to bruchner.dev
    needs: ci
    runs-on: ubuntu-24.04
    permissions: {}
    environment:
      name: production
      url: https://bruchner.dev/
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: dist

      # The key is locked to `rrsync /srv/bruchner.dev/site` on the host, and the
      # host key is pinned: never StrictHostKeyChecking=no.
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload site
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: >-
          rsync -rc --delete-delay --delay-updates --chmod=D755,F644
          -e "ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes"
          dist/ "deploy@${VPS_HOST}:"

      - name: Verify the deployed version
        run: |
          expected=$(cat dist/version.txt)
          for _ in 1 2 3 4 5 6; do
            actual=$(curl -fsS https://bruchner.dev/version.txt || true)
            [ "$actual" = "$expected" ] && exit 0
            sleep 5
          done
          echo "::error::bruchner.dev serves '${actual}', expected '${expected}'"
          exit 1
